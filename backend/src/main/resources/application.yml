server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tiedye
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

logging:
  level:
    com.baizu.tiedye: INFO
