server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tiedye
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  upload:
    dir: ${UPLOAD_DIR:${user.dir}/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}
  auth:

    require-login: ${REQUIRE_LOGIN:true}
  ai:

    allow-offline-fallback: ${AI_ALLOW_OFFLINE_FALLBACK:false}

    mode: ${AI_MODE:auto}
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    native-base-url: ${DASHSCOPE_NATIVE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}

    chat-model: ${DASHSCOPE_CHAT_MODEL:qwen3.7-plus}
    embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:qwen3.7-text-embedding}
    embedding-dimensions: ${DASHSCOPE_EMBEDDING_DIMENSIONS:1024}
    embedding-batch-size: 10

    enable-thinking: ${DASHSCOPE_ENABLE_THINKING:false}

    request-timeout: 20s
    max-correction-rounds: 1
    reindex-token: ${RAG_REINDEX_TOKEN:}
    rag:
      top-k: 6
      min-score: 0.16

      low-confidence: 0.18
    agent:
      max-iterations: 3
      max-tool-calls: 3
      history-turns: 8

logging:
  level:
    com.baizu.tiedye: INFO
