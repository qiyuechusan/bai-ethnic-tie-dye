<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" fill="none">
  <defs>
    <filter id="clothRough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .055" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <radialGradient id="indigoWash" cx="0" cy="0" r="1" gradientTransform="translate(365 345) rotate(88) scale(490 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#174D83"/>
      <stop offset=".55" stop-color="#0B3764"/>
      <stop offset="1" stop-color="#082B4F"/>
    </radialGradient>
    <radialGradient id="greenWash" cx="0" cy="0" r="1" gradientTransform="translate(202 245) rotate(39) scale(220 190)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AAB780" stop-opacity=".6"/>
      <stop offset="1" stop-color="#AAB780" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bleachWash" cx="0" cy="0" r="1" gradientTransform="translate(545 557) rotate(-121) scale(270 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8E5E6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#D8E5E6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stitchDots" width="17" height="17" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#F8F5EA" opacity=".23"/>
    </pattern>
    <pattern id="fineStitch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <path d="M0 4.5h9" stroke="#F8F5EA" stroke-opacity=".11" stroke-width=".7" stroke-dasharray="2 4"/>
    </pattern>
    <clipPath id="clothClip">
      <path d="M98 64c82-45 181-19 260-35 82-17 171-6 240 49 55 44 50 107 41 177-9 72 16 145-21 224-21 45-66 60-112 50-74-15-137 36-214 12-63-20-97-25-145-80-39-45-20-106-26-162-9-84-58-195-23-235Z"/>
    </clipPath>
  </defs>

  <g opacity=".22" filter="url(#softGlow)">
    <circle cx="565" cy="760" r="105" fill="#4C86AB"/>
    <circle cx="94" cy="128" r="92" fill="#6E9C9B"/>
  </g>

  <g transform="rotate(-3 360 430)">
